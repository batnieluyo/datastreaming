services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda-laravel
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=2G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,EXTERNAL://localhost:19092
      - --rpc-addr=0.0.0.0:33145
      - --advertise-rpc-addr=redpanda:33145
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "8081:8081"   # Schema registry port
      - "19092:19092" # external proxy
      - "8082:8082"   # Pandaproxy (opcional, REST)
      - "9092:9092"   # Kafka API
      - "9644:9644"   # Admin API
    volumes:
      - redpanda-laravel-data:/var/lib/redpanda/data
      - ./create-topics.sh:/etc/redpanda/post-start.d/create-topics.sh
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-laravel-console
    ports:
      - "9090:8080"     # UI web
    environment:
      - KAFKA_BROKERS=redpanda:9092
    depends_on:
      - redpanda
    volumes:
      - ./console-config.yml:/etc/console/config.yml:ro
  postgres:
    image: pgvector/pgvector:pg16   # pgvector preinstalado sobre Postgres 16
    container_name: postgres-laravel
    restart: unless-stopped
    environment:
      POSTGRES_DB: "laravel"
      POSTGRES_USER: "laravel"
      POSTGRES_PASSWORD: "password"
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: meilisearch
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: test_master_key
    ports:
      - "7700:7700"
    volumes:
      - meilisearch-data:/meili_data
  app:
    container_name: laravel
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ../../:/var/www/html
    environment:
      # Increase the upload limit to 500M
      PHP_UPLOAD_MAX_FILE_SIZE: "500M"
      # Turn OPCache on
      PHP_OPCACHE_ENABLE: "1"
      KAFKA_BROKERS: "redpanda:9092"
      SCOUT_DRIVER: "meilisearch"
      MEILISEARCH_HOST: "http://meilisearch:7700"
      MEILISEARCH_KEY: "test_master_key"
      DB_CONNECTION: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_DATABASE: "laravel"
      DB_USERNAME: "laravel"
      DB_PASSWORD: "password"
    depends_on:
      - redpanda
      - postgres
      - meilisearch

volumes:
  redpanda-laravel-data:
  postgres-data:
  meilisearch-data: